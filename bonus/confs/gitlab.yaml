apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
# gitlab regenerates /etc/gitlab secrets if lost, but then cannot read anything
# it encrypted before, so config and data are both persisted
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  # first boot runs the migrations and takes well over the default 10 minutes
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: gitlab
  strategy:
    # one RWO volume cannot be mounted by two pods, so never overlap them
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.2.1-ce.0
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                # nginx only answers to the external_url host, so this must be
                # the address argo cd clones from, not localhost
                external_url 'http://gitlab.gitlab.svc.cluster.local:8081'
                # /-/readiness answers 404 to anything outside this list, and
                # the kubelet probes from the pod network, not from localhost
                gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '10.42.0.0/16']
                nginx['listen_port'] = 8081
                nginx['listen_https'] = false
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                registry['enable'] = false
                gitlab_kas['enable'] = false
                puma['worker_processes'] = 2
                sidekiq['max_concurrency'] = 5
          ports:
            - containerPort: 8081
          # omnibus takes several minutes to migrate and boot on first start
          # the kubelet probes the pod ip, so without this Host header nginx
          # falls through to its default server and answers 404
          startupProbe:
            httpGet:
              path: /-/readiness
              port: 8081
              httpHeaders:
                - name: Host
                  value: gitlab.gitlab.svc.cluster.local:8081
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 8081
              httpHeaders:
                - name: Host
                  value: gitlab.gitlab.svc.cluster.local:8081
            periodSeconds: 15
          resources:
            requests:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: data
              mountPath: /var/opt/gitlab
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
---
# reachable two ways: localhost:8081 from the host through the k3d mapping,
# and gitlab.gitlab.svc.cluster.local:8081 from inside the cluster, which is
# the address argo cd clones from
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
