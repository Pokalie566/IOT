apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  # first boot runs the migrations and takes well over the default 10 minutes
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: gitlab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.2.1-ce.0
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.gitlab.svc.cluster.local:8081'
                gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '10.42.0.0/16']
                nginx['listen_port'] = 8081
                nginx['listen_https'] = false
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                registry['enable'] = false
                gitlab_kas['enable'] = false
                puma['worker_processes'] = 2
                sidekiq['max_concurrency'] = 5
          ports:
            - containerPort: 8081
          startupProbe:
            httpGet:
              path: /-/readiness
              port: 8081
              httpHeaders:
                - name: Host
                  value: gitlab.gitlab.svc.cluster.local:8081
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 8081
              httpHeaders:
                - name: Host
                  value: gitlab.gitlab.svc.cluster.local:8081
            periodSeconds: 15
          resources:
            requests:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: data
              mountPath: /var/opt/gitlab
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
