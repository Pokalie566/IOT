# APP_NAME is read by the image entrypoint to fill the page template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  # 3 replicas required by the subject
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app
          image: pokalie566/iot-app:v1
          env:
            - name: APP_NAME
              value: app2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
